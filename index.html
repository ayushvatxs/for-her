<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Ammai 🌸</title>
    <!-- Importing a cute, rounded font -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        /* Cute Pastel Background */
        body {
            margin: 0;
            font-family: 'Nunito', sans-serif;
            background-color: #ffe6ea;
            background-image: radial-gradient(#ffccd5 20%, transparent 20%), radial-gradient(#ffccd5 20%, transparent 20%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            color: #5c4d5c;
            overflow-x: hidden;
        }

        /* Main Card */
        .card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            padding: 40px 20px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(255, 143, 171, 0.2);
            border: 4px solid #fff;
        }

        h1 {
            color: #ff758f;
            margin-top: 0;
            font-size: 2.2em;
        }

        p.subtitle {
            color: #9d8189;
            font-size: 1.1em;
            margin-bottom: 30px;
        }

        /* 2x2 Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        /* Cute Squishy Boxes */
        .box {
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
            border-radius: 20px;
            font-size: 1.1em;
            font-weight: 800;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            border: 3px solid rgba(255,255,255,0.5);
            text-align: center;
            height: 80px;
        }

        .box:hover {
            transform: scale(1.08) translateY(-5px);
        }

        .box:active {
            transform: scale(0.95);
        }

        /* Individual Box Colors */
        .box1 { background: #ffb5a7; color: #6a4c4c; } /* Distraction - Peach */
        .box2 { background: #fec5bb; color: #6a4c4c; } /* Reminder - Pink */
        .box3 { background: #e2ece9; color: #4a5c57; } /* Treat - Mint */
        .box4 { background: #cddafd; color: #43547a; } /* Hug - Baby Blue */

        /* Display Area for Messages & Animations */
        #display-area {
            min-height: 80px;
            background: #fff;
            border-radius: 20px;
            padding: 20px;
            display: none;
            font-size: 1.1em;
            color: #ff758f;
            border: 2px dashed #ffccd5;
            animation: popIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Pure CSS Heartbeat Animation */
        .css-heart {
            position: relative;
            width: 60px;
            height: 55px;
            margin: 20px auto;
            animation: heartbeat 1.2s infinite;
        }
        .css-heart::before,
        .css-heart::after {
            content: "";
            position: absolute;
            top: 0;
            width: 30px;
            height: 45px;
            border-radius: 30px 30px 0 0;
            background: #ff4d6d;
        }
        .css-heart::before {
            left: 30px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }
        .css-heart::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1); }
            45% { transform: scale(1.3); }
            60% { transform: scale(1); }
            100% { transform: scale(1); }
        }

        /* CSS Virtual Treat Falling Animation */
        .falling-treat {
            position: fixed;
            top: -50px;
            font-size: 30px;
            user-select: none;
            pointer-events: none;
            animation: fall linear forwards;
            z-index: 9999;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Hey Ammai 🌸</h1>
        <p class="subtitle">A tiny, cute space just for you.</p>
        
        <div class="grid">
            <!-- Replace "YOUR_YOUTUBE_LINK_HERE" with her actual playlist link -->
            <a href="YOUR_YOUTUBE_LINK_HERE" target="_blank" class="box box1">Need a<br>Distraction 🎵</a>
            <div class="box box2" onclick="showReminder()">A Little<br>Reminder 💌</div>
            <div class="box box3" onclick="triggerTreat()">Virtual<br>Treat 🍰</div>
            <div class="box box4" onclick="showHug()">Emergency<br>Hug 🧸</div>
        </div>

        <div id="display-area"></div>
    </div>

    <script>
        const displayArea = document.getElementById('display-area');

        // Edit these reminders to say whatever you want!
        const reminders = [
            "You're the cutest. I love you so much!",
            "I know you're feeling uncomfy, but I'm right here with you.",
            "Take a deep breath. You are doing amazing.",
            "You mean the whole world to me. Go rest a bit! 💕"
        ];

        function clearDisplay() {
            displayArea.style.display = 'none';
            displayArea.innerHTML = '';
        }

        function showDisplay() {
            displayArea.style.display = 'flex';
        }

        function showReminder() {
            clearDisplay();
            const randomIndex = Math.floor(Math.random() * reminders.length);
            displayArea.innerHTML = "<strong>" + reminders[randomIndex] + "</strong>";
            showDisplay();
        }

        function showHug() {
            clearDisplay();
            displayArea.innerHTML = "<strong>Sending a giant, squishy hug!</strong><div class='css-heart'></div>";
            showDisplay();
        }

        function triggerTreat() {
            clearDisplay();
            displayArea.innerHTML = "<strong>Incoming treats! Look at the screen! 🍬✨</strong>";
            showDisplay();
            
            // This creates a cute shower of CSS emojis falling down the screen
            const treats = ['🍭', '🍫', '🌸', '✨', '🍓', '🍰'];
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const treat = document.createElement('div');
                    treat.classList.add('falling-treat');
                    treat.innerText = treats[Math.floor(Math.random() * treats.length)];
                    treat.style.left = Math.random() * 100 + 'vw';
                    treat.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.body.appendChild(treat);
                    
                    // Cleanup elements after animation
                    setTimeout(() => { treat.remove(); }, 5000);
                }, i * 100);
            }
        }
    </script>

</body>
</html>
